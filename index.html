<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modals of Deduction – Grade 7</title>
<style>
:root{
  --navy:#232a5c; --navy-d:#141a3e; --lilac:#e4e7fb; --lilac-m:#aab2ee; --amber:#ffc83d; --amber-d:#c48f00; --paper:#ffffff;
  --ink:#1b1f3b; --good:#2e9e6b; --good-bg:#dff5e8; --bad:#d9534f; --bad-bg:#fde8e6;
  --head:"Fredoka One","Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI","Trebuchet MS",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--body);color:var(--ink);background:linear-gradient(180deg,#e9ecfc 0%,#f6f7ff 50%,#fff6dd 100%);min-height:100vh;touch-action:manipulation;overflow-x:hidden}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
.floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaters span{position:absolute;font-size:34px;opacity:.13;animation:rise 20s linear infinite}
@keyframes rise{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(35deg)}}
#bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 0 var(--navy-d)}
#bar .logo{font-family:var(--head);font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--amber);color:var(--navy-d);border-radius:999px;padding:5px 14px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;min-height:38px}
#bar .snd{background:transparent;border:2px solid #ffffff88;color:#fff;border-radius:50%;width:40px;height:40px;font-size:18px}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:16px 14px 70px}
.screen{display:none}.screen.on{display:block}
.hero{text-align:center;background:#fff;border:3px dashed var(--navy);border-radius:30px;padding:18px 16px 20px;box-shadow:0 6px 0 var(--lilac-m)}
.hero h1{font-family:var(--head);font-weight:400;font-size:clamp(32px,8vw,58px);line-height:1;margin:0 0 12px;color:var(--navy)}
.hero .sub{display:inline-block;background:var(--lilac);border:3px solid var(--lilac-m);border-radius:999px;padding:6px 20px;font-weight:800;font-size:clamp(16px,3.6vw,20px)}
.hero .faces{font-size:32px;margin-top:12px;letter-spacing:8px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.who label{font-weight:800;font-size:15px;display:block;margin-bottom:4px}
input[type=text]{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:3px solid var(--lilac-m);border-radius:14px;background:#fff;color:var(--ink)}
input:focus,button:focus-visible{outline:4px solid var(--amber);outline-offset:2px}
.rules{background:#fff;border:3px solid var(--lilac-m);border-radius:20px;padding:12px 18px;margin-bottom:16px}
.rules h2{font-family:var(--head);font-weight:400;font-size:22px;margin:0 0 6px;color:var(--navy)}
.rules ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:18px}
.rules b{color:var(--navy)}
.levels{display:grid;gap:14px}
.lv{display:flex;align-items:center;gap:14px;text-align:start;width:100%;background:#fff;border:3px solid var(--navy);border-radius:22px;padding:14px 16px;box-shadow:0 5px 0 var(--navy);transition:transform .12s}
.lv:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy)}
.lv .n{flex:0 0 58px;height:58px;border-radius:50%;background:var(--amber);border:3px solid var(--amber-d);font-family:var(--head);font-size:28px;display:grid;place-items:center;color:var(--navy-d)}
.lv .t{flex:1}.lv .t b{display:block;font-size:21px}.lv .t span{font-size:15px;opacity:.8;display:block}
.lv .t i{font-style:normal;font-size:16px}
.lv .st{font-weight:800;font-size:16px;text-align:end}
.lv.done{background:var(--good-bg);border-color:var(--good);box-shadow:0 5px 0 var(--good)}
.lv.done .n{background:var(--good);border-color:var(--good);color:#fff}
.big{display:block;margin:22px auto 0;font-family:var(--head);font-size:22px;background:var(--amber);color:var(--navy-d);border:3px solid var(--amber-d);border-radius:999px;padding:13px 30px;box-shadow:0 5px 0 var(--amber-d);min-height:52px}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--amber-d)}
.big[disabled]{background:#e6e6e6;border-color:#b5b5b5;box-shadow:0 5px 0 #b5b5b5;color:#777;cursor:not-allowed}
.big.alt{background:var(--lilac);border-color:var(--lilac-m);box-shadow:0 5px 0 var(--lilac-m);color:var(--navy)}
.ghost{background:#fff;border:3px solid var(--lilac-m);color:var(--navy);border-radius:999px;padding:8px 18px;font-weight:800;font-size:16px;min-height:44px}
.sbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sbar h2{font-family:var(--head);font-weight:400;font-size:clamp(20px,4.5vw,28px);margin:0;flex:1;color:var(--navy)}
.dots{display:flex;gap:7px;margin-bottom:14px}
.dots i{flex:1;height:12px;border-radius:99px;background:#fff;border:2px solid var(--navy)}
.dots i.ok{background:var(--good);border-color:var(--good)}.dots i.no{background:var(--bad);border-color:var(--bad)}.dots i.now{background:var(--amber);border-color:var(--amber-d)}
.card{background:#fff;border:3px solid var(--navy);border-radius:26px;padding:18px;box-shadow:0 6px 0 var(--navy)}
.task{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:5px 16px;font-weight:800;font-size:16px;margin-bottom:12px}
.pic{display:block;margin:0 auto 12px;max-width:min(300px,80%);max-height:230px;border:3px solid var(--lilac);border-radius:18px;background:#fff}
.pic.shadow{border-color:var(--navy)}
.reveal{text-align:center;font-weight:800;font-size:22px;margin:-4px 0 10px;color:var(--good)}
.sent{font-size:clamp(20px,4.8vw,28px);font-weight:800;line-height:1.7;text-align:center;margin:6px 0 16px}
.slot{display:inline-block;min-width:104px;border-bottom:4px solid var(--navy);margin:0 4px;padding:0 8px;color:var(--navy);font-family:var(--head);font-weight:400;text-align:center}
.slot.ok{background:var(--good-bg);border-radius:10px;border-color:var(--good);color:var(--good)}
.slot.no{background:var(--bad-bg);border-radius:10px;border-color:var(--bad);color:var(--bad)}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opt,.cp,.tile{font-family:var(--head);font-size:clamp(19px,4.4vw,25px);background:#fff;color:var(--navy);border:3px solid var(--navy);border-radius:18px;padding:10px 18px;min-height:54px;box-shadow:0 4px 0 var(--navy);transition:transform .1s}
.opt:active,.cp:active,.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.opt.good{background:var(--good);border-color:#1d6e48;box-shadow:0 4px 0 #1d6e48;color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);box-shadow:none;color:#999;text-decoration:line-through;animation:shake .4s}
.opt[disabled],.cp[disabled],.tile[disabled]{cursor:default}
.cp.on{background:var(--amber);border-color:var(--amber-d);box-shadow:0 4px 0 var(--amber-d)}
.cp.cv{color:#6a2d9a;border-color:#a77ed1;box-shadow:0 4px 0 #a77ed1}
.cp.cv.on{background:var(--amber);border-color:var(--amber-d);box-shadow:0 4px 0 var(--amber-d);color:var(--navy)}
.cp[disabled]:not(.on){opacity:.45}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.shk{animation:shake .4s}
.line{min-height:76px;border:3px dashed var(--lilac-m);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:8px 0 14px;background:#fafaff}
.line.ok{border-color:var(--good);background:var(--good-bg)}.line.no{border-color:var(--bad);background:var(--bad-bg)}
.line .dot{font-family:var(--head);font-size:28px;color:var(--navy)}
.tile.pl{background:var(--lilac)}
.tile.used{opacity:.25;box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}
.lbl{text-align:center;font-weight:800;font-size:15px;opacity:.75;margin-top:10px}
.fb{margin-top:16px;border-radius:18px;padding:12px 16px;font-size:18px;font-weight:700;line-height:1.5;text-align:center;display:none}
.fb.show{display:block}.fb.g{background:var(--good-bg);border:3px solid var(--good)}.fb.b{background:var(--bad-bg);border:3px solid var(--bad)}.fb.i{background:#eef0ff;border:3px solid var(--lilac-m)}
.nextrow{display:flex;justify-content:center;margin-top:6px}
.ipa{display:block;font-weight:800;font-size:15px;color:#5a6aa8;margin:2px 0 0}
.learn{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:6px}
.lc{background:#fff;border:3px solid var(--navy);border-radius:20px;padding:12px 6px;text-align:center;width:100%;transition:transform .12s;box-shadow:0 4px 0 var(--navy)}
.lc .em{display:block;font-size:34px}
.lc b{display:block;font-family:var(--head);font-weight:400;font-size:24px;color:var(--navy);margin-top:4px}
.lc small{display:block;font-weight:700;font-size:13px;opacity:.75}
.lc .spk{display:inline-block;margin-top:6px;background:var(--lilac);border:2px solid var(--lilac-m);border-radius:999px;padding:3px 14px;font-weight:800;font-size:15px}
.lc.on{transform:scale(1.05);box-shadow:0 0 0 5px var(--amber)}
.h3{font-family:var(--head);font-weight:400;font-size:24px;color:var(--navy);margin:20px 0 8px}
.res{text-align:center}
.res h2{font-family:var(--head);font-weight:400;font-size:clamp(28px,7vw,44px);margin:0 0 4px;color:var(--navy)}
.stars{font-size:54px;letter-spacing:6px;margin:6px 0}.stars .off{filter:grayscale(1);opacity:.25}
.bigscore{font-family:var(--head);font-size:clamp(44px,12vw,76px);color:var(--navy);line-height:1}
.rank{display:inline-block;background:var(--amber);border:3px solid var(--amber-d);border-radius:999px;padding:6px 22px;font-family:var(--head);font-size:22px;margin:10px 0}
.brk{display:grid;gap:8px;max-width:420px;margin:14px auto;text-align:start}
.brk div{display:flex;justify-content:space-between;background:#eef0ff;border-radius:14px;padding:9px 16px;font-weight:800;font-size:18px}
.msg{font-size:19px;font-weight:700;margin:10px 0}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px}
footer{position:relative;z-index:1;text-align:center;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 22px);font-weight:800;color:var(--navy)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:560px){.who{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.floaters span,.opt.bad,.shk{animation:none}}
</style>
</head>
<body>
<div class="floaters" aria-hidden="true"></div>
<div id="bar">
  <div class="logo">🔍 Modals of Deduction</div>
  <div class="pill">⭐ <span id="sc">0</span> / <span id="mx">90</span></div>
  <button class="snd" id="vox" aria-label="Pronunciation on/off">🗣️</button>
  <button class="snd" id="snd" aria-label="Sound effects on/off">🔊</button>
</div>
<div class="wrap">
  <section id="home" class="screen on">
    <div class="hero">
      <h1>Modals of Deduction</h1>
      <span class="sub">Grade 7 • Read the clues. Make a deduction!</span>
      <div class="faces" aria-hidden="true">🔍 🐺 🐧 🐙 🐪 ☁️</div>
    </div>
    <div class="who">
      <div><label for="nm">Name</label><input type="text" id="nm" maxlength="30" autocomplete="off" placeholder="Your name"></div>
      <div><label for="cl">Class</label><input type="text" id="cl" maxlength="12" autocomplete="off" placeholder="e.g. 7/2"></div>
    </div>
    <div class="rules">
      <h2>🧠 Remember</h2>
      <ul>
        <li><b>must</b> = sure it is true</li>
        <li><b>can’t</b> = sure it is not true</li>
        <li><b>may / might</b> = possible, but not sure</li>
      </ul>
    </div>
    <button class="big alt" id="learnBtn" style="margin:0 auto 18px">🎧 Listen &amp; Learn the words</button>
    <div class="levels" id="levels"></div>
    <button class="big" id="finish" disabled>Finish all 3 levels to see your result</button>
  </section>
  <section id="stage" class="screen"></section>
  <section id="learn" class="screen"></section>
  <section id="results" class="screen"></section>
</div>
<footer>Created by T. Badria Alfalahi</footer>

var AC=null;
function tone(f,d,t,v){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);var n=AC.currentTime;g.gain.setValueAtTime(v||.12,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d)}catch(e){}}
function sOk(){tone(660,.14);setTimeout(function(){tone(880,.22)},120)}
function sBad(){tone(200,.25,'sawtooth',.08)}
function sWin(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,.25)},i*130)})}
function voiceFor(){var vs=[];try{vs=window.speechSynthesis.getVoices()}catch(e){}return vs.filter(function(x){return /^en[-_]GB/i.test(x.lang)})[0]||vs.filter(function(x){return /^en/i.test(x.lang)})[0]||null}
function speak(w,queue){if(!S.voice||!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;try{if(!queue)window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(w);u.lang='en-GB';u.rate=.8;var v=voiceFor();if(v)u.voice=v;window.speechSynthesis.speak(u)}catch(e){}}
$('snd').onclick=function(){S.sound=!S.sound;this.textContent=S.sound?'🔊':'🔇'};
$('vox').onclick=function(){S.voice=!S.voice;this.textContent=S.voice?'🗣️':'🤐';if(!S.voice&&window.speechSynthesis)window.speechSynthesis.cancel()};

/* confetti */
var cv=$('fx'),cx=cv.getContext('2d'),parts=[],run=false;
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function confetti(n){var cols=['#232a5c','#ffc83d','#aab2ee','#2e9e6b','#ff8aa0','#7ad0c8'];for(var i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,life:90+Math.random()*50});if(!run){run=true;frame()}}
function frame(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(function(q){return q.life>0});parts.forEach(function(q){q.x+=q.vx;q.y+=q.vy;q.vy+=.35;q.a+=.2;q.life--;cx.save();cx.translate(q.x,q.y);cx.rotate(q.a);cx.fillStyle=q.c;cx.fillRect(-q.r/2,-q.r/2,q.r,q.r*.6);cx.restore()});if(parts.length)requestAnimationFrame(frame);else run=false}

/* home */
function renderHome(){
  var h='';
  LEVELS.forEach(function(L){var d=ld(L.id);
    h+='<button class="lv'+(d?' done':'')+'" data-l="'+L.id+'"><span class="n">'+(d?'✓':L.id)+'</span><span class="t"><b>'+L.title+' <i>'+L.stars+'</i></b><span>'+L.sub+'</span></span><span class="st">'+(d?lp(L.id)+' pts':lc(L.id)+' / 3')+'</span></button>'});
  $('levels').innerHTML=h;
  [].forEach.call(document.querySelectorAll('.lv'),function(b){b.onclick=function(){openLevel(+b.dataset.l)}});
  var all=ld(1)&&ld(2)&&ld(3),f=$('finish');f.disabled=!all;f.textContent=all?'🏆 See my result':'Finish all 3 levels to see your result';
  upd();
}
function homeBack(){renderHome();show('home')}
$('finish').onclick=function(){if(!this.disabled)results()};
function openLevel(n){
  S.name=$('nm').value.trim();S.cls=$('cl').value.trim();
  if(n===1&&!S.w1)S.w1=[shuffle(L1W),shuffle(L1W),shuffle(L1W)];
  var i=0;while(i<3&&S.l[n][i].done)i++;
  if(i>=3){homeBack();return}
  S.cur={n:n,i:i};render();
}
function dots(n,cur){var h='<div class="dots">';S.l[n].forEach(function(r,i){var c=r.done?(r.pts>0?'ok':'no'):(i===cur?'now':'');h+='<i class="'+c+'"></i>'});return h+'</div>'}
function fbHtml(m){return '<div class="fb'+(m?' show '+m.c:'')+'">'+(m?m.t:'')+'</div>'}
function head(n,i,task){return '<div class="sbar"><button class="ghost" id="back">← Levels</button><h2>Level '+n+' · '+(i+1)+' / 3</h2></div>'+dots(n,i)+'<div class="card"><span class="task">'+task+'</span>'}
function foot(n,i){
  var r=S.l[n][i],h='</div>';
  if(r.done)h+='<div class="nextrow"><button class="big" id="nb">'+(i<2?'Next ➜':'Finish this level ✓')+'</button></div>';
  return h;
}
function bindCommon(){
  $('back').onclick=function(){if(window.speechSynthesis)window.speechSynthesis.cancel();homeBack()};
  var nb=$('nb');if(nb)nb.onclick=function(){if(S.cur.i<2){S.cur.i++;render()}else{homeBack();sWin();confetti(70)}};
}
function render(){S.cur.n===1?render1():S.cur.n===2?render2():render3();upd()}

/* ===== Level 1 ===== */
function render1(){
  var i=S.cur.i,it=L1[i],r=S.l[1][i];
  var h=head(1,i,'Complete the sentence with the correct word.');
  h+='<img class="pic" alt="" src="'+IM[it.img]+'">';
  h+='<div class="sent">'+esc(it.pre)+' <span class="slot'+(r.done?(r.rev?' no':' ok'):'')+'">'+(r.done?esc(it.ans):'&nbsp;&nbsp;&nbsp;?')+'</span> '+esc(it.post)+'</div><div class="opts">';
  S.w1[i].forEach(function(w){var cls='opt'+(r.done&&w===it.ans?' good':'')+(r.wrong.indexOf(w)>-1?' bad':'');
    h+='<button class="'+cls+'" data-w="'+w+'"'+(r.done||r.wrong.indexOf(w)>-1?' disabled':'')+'>'+w+'</button>'});
  h+='</div>'+fbHtml(r.msg)+foot(1,i);
  $('stage').innerHTML=h;show('stage');bindCommon();
  [].forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){pick1(b.dataset.w)}});
}
function pick1(w){
  var i=S.cur.i,it=L1[i],r=S.l[1][i];if(r.done)return;speak(w);
  if(w===it.ans){
    r.done=true;r.pts=r.wrong.length===0?P1:(r.wrong.length===1?P2:0);sOk();confetti(r.wrong.length===0?45:20);
    r.msg={c:'g',t:(r.wrong.length===0?'🌟 Correct! +'+P1:'👍 Good! +'+r.pts+' (second try)')+'<br>“'+it.full+'”<br>'+it.why};
    setTimeout(function(){speak(it.full)},400);
  }else{
    r.wrong.push(w);sBad();
    if(r.wrong.length>=2){r.done=true;r.rev=true;r.pts=0;r.msg={c:'b',t:'💡 The answer is “'+it.ans+'”. 0 points this time.<br>“'+it.full+'”<br>'+it.why}}
    else r.msg={c:'b',t:'🔎 Not quite. Read the clue again and try another word!'};
  }
  render();
}

/* ===== Level 2 ===== */
function norm(s){return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?]/g,'').replace(/\s+/g,' ').trim()}
function render2(){
  var i=S.cur.i,it=L2[i],r=S.l[2][i];
  var h=head(2,i,'Put the words in order to make a correct sentence.');
  h+='<div class="lbl">Tap the words in the correct order</div>';
  h+='<div class="line'+(r.done?(r.rev?' no':' ok'):'')+(S.shk===i?' shk':'')+'" id="line">';
  r.ans.forEach(function(idx,k){h+='<button class="tile pl" data-a="'+k+'"'+(r.done?' disabled':'')+'>'+(k===0?cap(it.words[idx]):it.words[idx])+'</button>'});
  if(r.ans.length===it.words.length)h+='<span class="dot">.</span>';
  h+='</div><div class="row">';
  it.words.forEach(function(w,idx){var u=r.ans.indexOf(idx)>-1;h+='<button class="tile'+(u?' used':'')+'" data-p="'+idx+'"'+(u||r.done?' disabled':'')+'>'+w+'</button>'});
  h+='</div>';
  if(!r.done)h+='<div class="row"><button class="ghost" id="clr">↺ Clear</button><button class="big" id="chk" style="margin:0">🔍 Check</button></div>';
  h+=fbHtml(r.msg)+foot(2,i);
  S.shk=null;
  $('stage').innerHTML=h;show('stage');bindCommon();
  [].forEach.call(document.querySelectorAll('.tile[data-p]'),function(b){b.onclick=function(){speak(it.words[+b.dataset.p]);r.ans.push(+b.dataset.p);r.msg=null;render()}});
  [].forEach.call(document.querySelectorAll('.tile[data-a]'),function(b){b.onclick=function(){r.ans.splice(+b.dataset.a,1);r.msg=null;render()}});
  var c=$('clr');if(c)c.onclick=function(){r.ans=[];r.msg=null;render()};
  var k=$('chk');if(k)k.onclick=check2;
}
function cap(w){return w.charAt(0).toUpperCase()+w.slice(1)}
function check2(){
  var i=S.cur.i,it=L2[i],r=S.l[2][i];
  if(r.ans.length<it.words.length){r.msg={c:'i',t:'Use all the words first.'};render();return}
  var s=norm(r.ans.map(function(x){return it.words[x]}).join(' '));
  var okk=it.ok.some(function(a){return norm(a)===s});
  if(okk){
    r.done=true;r.pts=r.tries===0?P1:(r.tries===1?P2:0);sOk();confetti(r.tries===0?45:20);
    var text=cap(s).replace(/ i /g,' I ')+'.';text=text.replace(/can't/,'can’t');
    r.msg={c:'g',t:(r.tries===0?'🌟 Perfect sentence! +'+P1:'👍 Good! +'+r.pts+' (second try)')+'<br>“'+text+'”'};
    setTimeout(function(){speak(text)},400);
  }else{
    r.tries++;sBad();S.shk=i;
    if(r.tries>=2){
      var target=it.ok[0].split(' '),used=[],ans=[];
      target.forEach(function(w){for(var x=0;x<it.words.length;x++){if(used.indexOf(x)<0&&norm(it.words[x])===w){used.push(x);ans.push(x);break}}});
      r.ans=ans;r.done=true;r.rev=true;r.pts=0;
      var tx=cap(it.ok[0])+'.';tx=tx.replace(/can't/,'can’t');
      r.msg={c:'b',t:'💡 The correct sentence is: “'+tx+'” 0 points this time.'};
    }else r.msg={c:'b',t:'🔎 Not quite. Think about the order: who or what? + modal + be + the rest.'};
  }
  render();
}

/* ===== Level 3 ===== */
function render3(){
  var i=S.cur.i,it=L3[i],r=S.l[3][i];
  var h=head(3,i,'Look at the animal shadow. Write a sentence to describe it.');
  h+='<img class="pic shadow" alt="Animal shadow" src="'+IM[it.img]+'">';
  if(r.done)h+='<div class="reveal">'+it.em+' It is a '+it.truth+'!</div>';
  var cl=r.done?(r.rev?' no':' ok'):'';
  h+='<div class="sent'+(S.shk===i?' shk':'')+'">It <span class="slot'+cl+'">'+(r.m?modLabel(r.m):'&nbsp;&nbsp;&nbsp;?')+'</span> be a <span class="slot'+cl+'">'+(r.a?r.a:'&nbsp;&nbsp;&nbsp;?')+'</span>.</div>';
  S.shk=null;
  h+='<div class="lbl">Choose: might / must / can’t</div><div class="row">';
  MODS.forEach(function(m){h+='<button class="cp cv'+(r.m===m[0]?' on':'')+'" data-m="'+m[0]+'"'+(r.done?' disabled':'')+'>'+m[1]+'</button>'});
  h+='</div><div class="lbl">Choose an animal</div><div class="row">';
  ANIM.forEach(function(a){h+='<button class="cp'+(r.a===a?' on':'')+'" data-a="'+a+'"'+(r.done?' disabled':'')+'>'+a+'</button>'});
  h+='</div>';
  if(!r.done)h+='<div class="row"><button class="big" id="chk" style="margin:6px 0 0">🔍 Check</button></div>';
  h+=fbHtml(r.msg)+foot(3,i);
  $('stage').innerHTML=h;show('stage');bindCommon();
  [].forEach.call(document.querySelectorAll('.cp[data-m]'),function(b){b.onclick=function(){r.m=b.dataset.m;speak(modLabel(r.m));r.msg=null;render()}});
  [].forEach.call(document.querySelectorAll('.cp[data-a]'),function(b){b.onclick=function(){r.a=b.dataset.a;speak(r.a);r.msg=null;render()}});
  var k=$('chk');if(k)k.onclick=check3;
}
function modLabel(m){return m==='cant'?'can’t':m}
function check3(){
  var i=S.cur.i,it=L3[i],r=S.l[3][i];
  if(!r.m||!r.a){r.msg={c:'i',t:'Choose a modal verb and an animal first.'};render();return}
  var isT=r.a===it.truth,good=(r.m==='cant')?!isT:isT;
  var text='It '+modLabel(r.m)+' be a '+r.a+'.';
  if(good){
    r.done=true;r.pts=r.tries===0?P1:(r.tries===1?P2:0);sOk();confetti(r.tries===0?45:20);
    var why=r.m==='cant'?'You are sure it is not a '+r.a+', so <b>can’t</b> works.':(r.m==='might'?'The shadow is not clear, so <b>might</b> is a safe choice.':'You are sure about the shape, so <b>must</b> works.');
    r.msg={c:'g',t:(r.tries===0?'🌟 Great deduction! +'+P1:'👍 Good! +'+r.pts+' (second try)')+'<br>“'+text+'”<br>'+why};
    setTimeout(function(){speak(text)},400);
  }else{
    r.tries++;sBad();S.shk=i;
    if(r.tries>=2){
      r.done=true;r.rev=true;r.pts=0;r.m='might';r.a=it.truth;
      r.msg={c:'b',t:'💡 Example: “It might be a '+it.truth+'.” 0 points this time.'};
    }else if(r.m==='cant'){r.msg={c:'b',t:'🔎 Hmm. <b>can’t</b> means you are sure it is NOT that animal. Look at the shape again!'}}
    else{r.msg={c:'b',t:'🔎 Not quite. Look carefully at the shape of the shadow!'}}
  }
  render();
}

/* ===== Listen & Learn ===== */
function renderLearn(){
  var h='<div class="sbar"><button class="ghost" id="lback">← Back</button><h2>🎧 Listen &amp; Learn</h2></div><div class="tip" style="background:#eef0ff;border-radius:16px;padding:9px 14px;font-weight:800;text-align:center;margin-bottom:10px">Tap a card to hear the word. Say it after me!</div><div class="btns" style="margin:0 0 6px"><button class="big" id="pall" style="margin:0">▶ Play all words</button></div>';
  var G=[['Modal verbs',[['must','sure it is true','🔒'],['can’t','sure it is not true','🚫'],['may','possible, not sure','🤔'],['might','possible, not sure','🤔'],['be','after a modal','➕']]],
   ['Animals',[['wolf','','🐺'],['penguin','','🐧'],['octopus','','🐙'],['camel','','🐪'],['fish','','🐟']]],
   ['Other words',[['doctor','','🧑‍⚕️'],['bird','','🐦'],['rain','','🌧️'],['cloudy','','☁️'],['asleep','','😴'],['hump','','⛰️']]]];
  var all=[];
  G.forEach(function(g){h+='<div class="h3">'+g[0]+'</div><div class="learn">';
    g[1].forEach(function(w){all.push(w[0]);h+='<button class="lc" data-w="'+w[0]+'"><span class="em">'+w[2]+'</span><b>'+w[0]+'</b><span class="ipa">/'+IPA[w[0]]+'/</span>'+(w[1]?'<small>'+w[1]+'</small>':'')+'<span class="spk">🔊 Listen</span></button>'});
    h+='</div>'});
  $('learn').innerHTML=h;show('learn');
  $('lback').onclick=function(){if(window.speechSynthesis)window.speechSynthesis.cancel();homeBack()};
  [].forEach.call(document.querySelectorAll('.lc'),function(b){b.onclick=function(){speak(b.dataset.w);b.classList.add('on');setTimeout(function(){b.classList.remove('on')},700)}});
  $('pall').onclick=function(){if(!S.voice||!window.speechSynthesis)return;window.speechSynthesis.cancel();all.forEach(function(w){speak(w,true)})};
}
$('learnBtn').onclick=renderLearn;

/* ===== Results ===== */
function results(){
  var t=total(),pct=Math.round(t/MAX*100),stars=pct>=90?3:pct>=70?2:pct>=40?1:0;
  var rank=pct>=90?'Master Detective 🕵️':pct>=70?'Chief Detective 🔍':pct>=40?'Junior Detective 🐾':'Detective Trainee 📘';
  var nm=S.name||'Detective';
  var msg=pct>=90?'Amazing, '+esc(nm)+'! Your deductions are super sharp!':pct>=70?'Well done, '+esc(nm)+'! You are a great detective!':pct>=40?'Good effort, '+esc(nm)+'! Play again to find every clue.':'Keep going, '+esc(nm)+'! Every detective learns by trying again.';
  var sh='';for(var i=0;i<3;i++)sh+='<span class="'+(i<stars?'':'off')+'">⭐</span>';
  var h='<div class="card res"><h2>Case closed!</h2>'+(S.name?'<div style="font-weight:800;font-size:19px">'+esc(S.name)+(S.cls?' · '+esc(S.cls):'')+'</div>':'')+'<div class="stars">'+sh+'</div><div class="bigscore">'+t+' / '+MAX+'</div><div style="font-weight:800;font-size:20px">'+pct+'%</div><div class="rank">'+rank+'</div><div class="brk"><div><span>Level 1 · Complete</span><span>'+lp(1)+' / 30</span></div><div><span>Level 2 · Word order</span><span>'+lp(2)+' / 30</span></div><div><span>Level 3 · Shadows</span><span>'+lp(3)+' / 30</span></div></div><p class="msg">'+msg+'</p><div class="btns"><button class="big" id="again" style="margin:0">🔄 Play again</button><button class="ghost" id="rev">← Back to levels</button></div></div>';
  $('results').innerHTML=h;show('results');sWin();confetti(pct>=70?140:50);
  $('again').onclick=function(){var n=$('nm').value,c=$('cl').value;fresh();$('nm').value=n;$('cl').value=c;homeBack()};
  $('rev').onclick=homeBack;
}
renderHome();
})();
</script>
